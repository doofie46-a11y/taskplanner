name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Windows ───────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/desktop.txt
          pip install pillow

      - name: Generate icons
        run: python desktop/make_icons.py

      - name: Build with PyInstaller
        run: pyinstaller taskplanner_desktop.spec

      - name: Verify bundled timezone data
        shell: bash
        run: pyi-archive_viewer -r -b dist/TaskPlanner.exe | grep -E 'tzdata.zoneinfo.Europe.Rome'

      - name: Verify version metadata
        shell: pwsh
        run: |
          $v = (Get-Item dist/TaskPlanner.exe).VersionInfo
          "ProductName=$($v.ProductName) ProductVersion=$($v.ProductVersion)"
          if ($v.ProductName -ne 'TaskPlanner' -or -not $v.ProductVersion) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TaskPlanner-windows
          path: dist/TaskPlanner.exe
          retention-days: 1

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    # Versione fissa, non ubuntu-latest: il binario richiede una glibc almeno pari
    # a quella della macchina di build, e una più vecchia lo fa girare su più distro
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/desktop.txt
          pip install pillow

      - name: Generate icons
        run: python desktop/make_icons.py

      - name: Build with PyInstaller
        run: pyinstaller taskplanner_desktop.spec

      - name: Verify bundled timezone data
        shell: bash
        run: pyi-archive_viewer -r -b dist/TaskPlanner | grep -E 'tzdata.zoneinfo.Europe.Rome'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TaskPlanner-linux
          path: dist/TaskPlanner
          retention-days: 1

  # ── Release ───────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # firma Sigstore dell'attestazione
      attestations: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8

      - name: Prepare release files
        run: |
          set -xe
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"           # v1.4.1 → 1.4.1

          # Rinomina con versione: evita basename identici (TaskPlanner) che
          # causano conflitti sull'upload endpoint di GitHub
          cp "TaskPlanner-windows/TaskPlanner.exe" "./TaskPlanner-${VER}-windows.exe"
          cp "TaskPlanner-linux/TaskPlanner"        "./TaskPlanner-${VER}-linux"
          chmod +x "./TaskPlanner-${VER}-linux"
          ls -lh TaskPlanner-${VER}-*

          # Checksum per verificare il download (istruzioni nel README)
          sha256sum "TaskPlanner-${VER}-windows.exe" "TaskPlanner-${VER}-linux" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Attestazione di provenienza (SLSA, firmata con Sigstore): lega ogni
      # eseguibile a questo repository, commit e run. Verifica nel README.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-checksums: SHA256SUMS.txt

      - name: Create GitHub Release and attach binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -xe
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          REPO="${{ github.repository }}"

          # Elimina release esistente (idempotente su retry)
          gh release delete "$TAG" --repo "$REPO" --yes 2>/dev/null || true
          sleep 2

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "TaskPlanner $TAG" \
            --notes "Binaries for Windows and Linux — see the [README](https://github.com/$REPO#download) for first-launch instructions and how to verify the checksums. Enjoying TaskPlanner? [Buy me a beer 🍺](https://ko-fi.com/claudioruffina)" \
            "./TaskPlanner-${VER}-windows.exe" \
            "./TaskPlanner-${VER}-linux" \
            "./SHA256SUMS.txt"
