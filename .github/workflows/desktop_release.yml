name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Windows ───────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/desktop.txt
          pip install pillow

      - name: Generate icons
        run: python desktop/make_icons.py

      - name: Build with PyInstaller
        run: pyinstaller taskplanner_desktop.spec

      - name: Verify bundled timezone data
        shell: bash
        run: pyi-archive_viewer -r -b dist/TaskPlanner.exe | grep -E 'tzdata.zoneinfo.Europe.Rome'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPlanner-windows
          path: dist/TaskPlanner.exe
          retention-days: 1

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/desktop.txt
          pip install pillow

      - name: Generate icons
        run: python desktop/make_icons.py

      - name: Build with PyInstaller
        run: pyinstaller taskplanner_desktop.spec

      - name: Verify bundled timezone data
        shell: bash
        run: pyi-archive_viewer -r -b dist/TaskPlanner | grep -E 'tzdata.zoneinfo.Europe.Rome'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPlanner-linux
          path: dist/TaskPlanner
          retention-days: 1

  # ── Release ───────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release and attach binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -xe
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"           # v1.4.1 → 1.4.1
          REPO="${{ github.repository }}"

          # Rinomina con versione: evita basename identici (TaskPlanner) che
          # causano conflitti sull'upload endpoint di GitHub
          cp "TaskPlanner-windows/TaskPlanner.exe" "./TaskPlanner-${VER}-windows.exe"
          cp "TaskPlanner-linux/TaskPlanner"        "./TaskPlanner-${VER}-linux"
          chmod +x "./TaskPlanner-${VER}-linux"
          ls -lh TaskPlanner-${VER}-*

          # Elimina release esistente (idempotente su retry)
          gh release delete "$TAG" --repo "$REPO" --yes 2>/dev/null || true
          sleep 2

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "TaskPlanner $TAG" \
            --notes "Binaries for Windows and Linux — see the [README](https://github.com/$REPO#download) for first-launch instructions. Enjoying TaskPlanner? [Buy me a beer 🍺](https://ko-fi.com/claudioruffina)" \
            "./TaskPlanner-${VER}-windows.exe" \
            "./TaskPlanner-${VER}-linux"
